[project]
name = "text2sql-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlglot>=30,<31",
  "jinja2>=3.1",
  "httpx>=0.27",
  "structlog>=24",
  "numpy>=2.0",
  "pyyaml>=6",
  "redis>=5",
  "prometheus-client>=0.20",
  "prometheus-fastapi-instrumentator>=7",
  "arq>=0.26",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "testcontainers[postgres,redis]>=4.8",
  "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "faker>=28",
  "types-pyyaml", "asgi-lifespan>=2", "fakeredis>=2.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in a parameter default is the framework's own
# idiom, not the mutable-default-argument bug B008 guards against -- the
# call just builds a marker object FastAPI's dependency solver reads at
# request time, it never executes eagerly.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs docker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
