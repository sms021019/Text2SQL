services:
  postgres:
    build: ./seed
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_DB_URL: postgresql+asyncpg://app:app@postgres:5432/app
      TARGET_DB_URL: postgresql+asyncpg://readonly:readonly@postgres:5432/target
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      # No curl in the ollama image -- `ollama list` talks to the local
      # server over its own client instead.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "OLLAMA_HOST=http://ollama:11434 ollama pull ${LLM_MODEL:-qwen2.5-coder:7b} &&
      OLLAMA_HOST=http://ollama:11434 ollama pull ${EMBED_MODEL:-nomic-embed-text}"
    restart: "no"

volumes:
  pgdata:
  ollama:
