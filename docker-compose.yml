services:
  postgres:
    build: ./seed
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_DB_URL: postgresql+asyncpg://app:app@postgres:5432/app
      TARGET_DB_URL: postgresql+asyncpg://readonly:readonly@postgres:5432/target
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Same image as `backend`, with the uvicorn CMD replaced by the arq
    # worker. No ports: it only talks to postgres and redis.
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    # The image's HEALTHCHECK curls the API's /healthz, which this container
    # does not serve -- it would report permanently unhealthy otherwise.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      APP_DB_URL: postgresql+asyncpg://app:app@postgres:5432/app
      TARGET_DB_URL: postgresql+asyncpg://readonly:readonly@postgres:5432/target
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    # Always on, not behind a profile: the metrics stack is part of the
    # Phase 2 demo, not an optional extra.
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Anonymous Viewer so the demo needs no login; admin/admin still logs
      # in for editing. Local-only stack (127.0.0.1), never exposed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # The two provisioning subdirectories only, not the whole
      # /etc/grafana/provisioning tree: masking it would hide the image's
      # own empty alerting/ and plugins/ directories, which Grafana then
      # logs an error for on every start.
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      # No curl in the ollama image -- `ollama list` talks to the local
      # server over its own client instead.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "OLLAMA_HOST=http://ollama:11434 ollama pull ${LLM_MODEL:-qwen2.5-coder:7b} &&
      OLLAMA_HOST=http://ollama:11434 ollama pull ${EMBED_MODEL:-nomic-embed-text}"
    restart: "no"

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  ollama:
