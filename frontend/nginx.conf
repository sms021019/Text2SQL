server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file serves
    # index.html so client-side routing (if added later) still works.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service (see docker-compose.yml).
    # X-Request-ID is forwarded through so `RequestIDMiddleware` on the
    # backend can honor a client-supplied id if one is set. Timeouts are
    # raised above nginx's 60s default and buffering disabled: an LLM-backed
    # query can legitimately run well past a minute, and buffering the
    # (small, non-streamed) response gains nothing here.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # The backend's health/readiness probes live at the root, not under
    # /api/v1 -- proxy them too so the frontend container's own network
    # position can be used to check backend health if needed.
    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    location /readyz {
        proxy_pass http://backend:8000/readyz;
    }
}
