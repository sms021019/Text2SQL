# Prometheus config for the local docker compose stack.
#
# Two jobs, one per process that records `t2s_*` series:
#   - `text2sql-backend`: the FastAPI /metrics endpoint, exposed in
#     `backend/app/main.py` against the app's own CollectorRegistry (every
#     `t2s_*` collector plus prometheus-fastapi-instrumentator's `http_*`
#     ones).
#   - `text2sql-worker`: the arq worker's copy of that registry, served
#     from a plain WSGI thread by `app/observability/exporter.py` because
#     the worker has no ASGI app.
#
# Both expose the same `t2s_*` metric *names*, distinguished by the `job`
# label Prometheus attaches: `sum(rate(t2s_...))` aggregates the two
# processes, `... by (job)` splits them.
#
# `scrape_interval: 5s` is deliberately short for a demo: `make load-test`
# runs for 60 s, which at this interval is ~12 samples per series -- enough
# for the Grafana panels to visibly move rather than showing a single flat
# point. It is not a production default.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: text2sql-backend
    # A plain route (Instrumentator.expose), not a mount: /metrics answers
    # directly, with no trailing-slash redirect to follow.
    metrics_path: /metrics
    static_configs:
      # Container name and container port on the compose network -- not the
      # 127.0.0.1:8000 host publication.
      - targets: ["backend:8000"]

  - job_name: text2sql-worker
    metrics_path: /metrics
    static_configs:
      # WORKER_METRICS_PORT in docker-compose.yml's `worker` service.
      - targets: ["worker:9100"]
